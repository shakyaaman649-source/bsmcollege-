<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BSM College - Sahawar</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:sans-serif}#adminPanel{display:none}#loginPage{display:none;min-height:100vh;padding-top:60px}</style></head><body class="bg-gray-50">
<header class="bg-white shadow sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><h1 class="font-bold text-lg text-blue-800">BSM COLLEGE SAHAWAR</h1><div class="flex gap-2"><button onclick="document.getElementById('notices').scrollIntoView({behavior:'smooth'})" class="text-sm font-semibold px-3 py-1">Notices</button><button onclick="openLogin()" class="bg-blue-700 text-white px-4 py-1.5 rounded-full text-sm font-bold">🔐 Admin Login</button></div></div></header>
<main id="publicSite"><section class="bg-gradient-to-br from-blue-900 to-blue-600 text-white py-20 px-4 text-center"><h2 class="text-4xl font-bold">BSM College Sahawar</h2><p class="mt-3">Kasganj | Education for Excellence</p></section><section id="notices" class="max-w-5xl mx-auto px-4 py-12"><h3 class="text-2xl font-bold mb-6">Latest Notices</h3><div id="noticeList" class="grid gap-4"><p class="text-gray-500 bg-white p-6 rounded shadow text-center">Loading...</p></div></section></main>
<div id="loginPage" class="bg-gray-100 px-4"><div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10"><h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2><input id="loginEmail" type="email" value="admin@bsmcollege@gmail.com" class="w-full border-2 p-3 rounded-lg mb-3"><input id="loginPassword" type="password" placeholder="Password" class="w-full border-2 p-3 rounded-lg mb-3"><button onclick="login()" id="loginBtn" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold">Login</button><button onclick="resetPass()" class="w-full mt-2 text-blue-600 text-sm">Password bhul gaye? Reset bhejo</button><button onclick="closeLogin()" class="w-full mt-4 text-gray-500 text-sm">← Back</button><p id="loginError" class="text-sm mt-4 text-center font-bold"></p></div></div>
<div id="adminPanel" class="min-h-screen bg-gray-100 p-4"><div class="max-w-5xl mx-auto"><div class="flex justify-between bg-white p-4 rounded shadow mb-6"><h2 class="font-bold">Admin Dashboard</h2><button onclick="logout()" class="bg-red-600 text-white px-4 py-1 rounded">Logout</button></div><div class="bg-white p-6 rounded shadow mb-6"><h3 class="font-bold mb-3">+ Naya Notice</h3><input id="noticeTitle" placeholder="Title" class="w-full border p-3 rounded mb-3"><textarea id="noticeDesc" placeholder="Description" class="w-full border p-3 rounded mb-3"></textarea><button onclick="addNotice()" class="bg-green-600 text-white px-6 py-2 rounded font-bold">Publish</button></div><div id="adminNoticeList" class="bg-white p-4 rounded shadow"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyD_92y08ytyuCjC2h0aBUgR6Z3qDQVrBaA",
  authDomain: "bsm-college.firebaseapp.com",
  projectId: "bsm-college",
  storageBucket: "bsm-college.firebasestorage.app",
  messagingSenderId: "851384629756",
  appId: "1:851384629756:web:8faeb808c30d88b9b19a79",
  measurementId: "G-V89HC0TNKD"
};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.firestore();
function openLogin(){document.getElementById('publicSite').style.display='none';document.getElementById('adminPanel').style.display='none';document.getElementById('loginPage').style.display='block';}
function closeLogin(){document.getElementById('loginPage').style.display='none';document.getElementById('publicSite').style.display='block';}
async function login(){const email=document.getElementById('loginEmail').value.trim();const pass=document.getElementById('loginPassword').value;const err=document.getElementById('loginError');const btn=document.getElementById('loginBtn');err.style.color='blue';err.innerText='Checking...';btn.disabled=true;btn.innerText='Login...';try{await auth.signInWithEmailAndPassword(email,pass);err.innerText='';}catch(e){err.style.color='red';err.innerText=e.message;}btn.disabled=false;btn.innerText='Login';}
async function resetPass(){const email=document.getElementById('loginEmail').value.trim();const err=document.getElementById('loginError');try{await auth.sendPasswordResetEmail(email);err.style.color='green';err.innerText='Reset link bhej diya! Gmail check karo.';}catch(e){err.style.color='red';err.innerText=e.message;}}
function logout(){auth.signOut();closeLogin();}
auth.onAuthStateChanged(user=>{if(user){document.getElementById('publicSite').style.display='none';document.getElementById('loginPage').style.display='none';document.getElementById('adminPanel').style.display='block';}else{document.getElementById('adminPanel').style.display='none';}});
async function addNotice(){const t=document.getElementById('noticeTitle').value.trim();const d=document.getElementById('noticeDesc').value.trim();if(!t)return alert('Title likho');await db.collection('notices').add({title:t,desc:d,date:new Date()});alert('Published!');loadNotices();}
async function loadNotices(){try{const snap=await db.collection('notices').orderBy('date','desc').limit(15).get();const div=document.getElementById('noticeList');div.innerHTML='';snap.forEach(doc=>{const n=doc.data();div.innerHTML+=`<div class="bg-white p-5 rounded shadow border-l-4 border-blue-700"><b>${n.title}</b><p class="text-sm text-gray-600">${n.desc||''}</p></div>`;});if(snap.empty)div.innerHTML="<p class='bg-white p-6 rounded shadow text-center'>Koi notice nahi</p>";}catch(e){}}
loadNotices();
</script></body></html>
